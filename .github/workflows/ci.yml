name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify installed package identity
        shell: bash
        run: |
          python -m pip check
          python - <<'PY'
          from importlib.metadata import distribution

          expected_name = "inferenceledger"
          expected_version = "0.1.0"
          dist = distribution(expected_name)
          actual_name = dist.metadata["Name"]
          actual_version = dist.version
          if actual_name != expected_name:
              raise SystemExit(f"distribution name mismatch: {actual_name!r} != {expected_name!r}")
          if actual_version != expected_version:
              raise SystemExit(
                  f"distribution version mismatch: {actual_version!r} != {expected_version!r}"
              )
          print(f"distribution={actual_name} version={actual_version}")
          PY
          inferenceledger-smoke --help >/dev/null
          inference-smoke --help >/dev/null

      - name: Check
        run: make check PYTHON=python
