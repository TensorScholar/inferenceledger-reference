[project]
name = "inferenceledger"
version = "0.1.0"
description = "Bounded inference-change assurance with reproducible evidence and decision provenance"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Mohammad Atashi" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.4,<3",
  "pydantic-settings>=2,<3",
  "structlog>=23,<25",
  "numpy>=1.26,<2",
]

[project.urls]
Repository = "https://github.com/TensorScholar/inferenceledger-reference"
Issues = "https://github.com/TensorScholar/inferenceledger-reference/issues"

[project.scripts]
inferenceledger-smoke = "inference_engine.cli:main"
inference-smoke = "inference_engine.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<8",
  "ruff>=0.16.6,<1",
  "mypy>=1.10,<2",
]
providers = [
  "openai>=1.0,<2",
  "text-generation>=0.7,<1",
]
local-serving = [
  "vllm>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
